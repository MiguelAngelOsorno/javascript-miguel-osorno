<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css"> 
    <title>Página Básica</title>
</head>
<body>
    <div class="tarjeta">
        <h1>Página Básica</h1>
        <img src="https://static.wikia.nocookie.net/winner/images/d/d6/Operaciones_basicas_de_matematicas.jpg/revision/latest?cb=20130627200513&path-prefix=es" alt="operaciones aritmeticas basicas.">
        <br><br>
        <label for="num1">Ingresa el primer número:</label>
        <input type="number" id="num1" placeholder="valor numerico" min="0">
        <br><br>
        <label for="num2">Ingrese el segundo número:</label>
        <input type="number" id="num2" placeholder="valor numerico" min="0">
        <br><br>
        <label for="opcion">Operación:</label>
        <select id="opcion">
            <option value="">Seleccione una opción</option>
            <option value="suma">Suma</option>
            <option value="resta">Resta</option>
            <option value="multiplicacion">Multiplicación</option>
            <option value="division">División</option>
        </select>
        <br><br>
        <p id="salida"></p>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
